[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Estos iconos incluyen un hash de contenido en el nombre.
[[headers]]
  for = "/iconos-opt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
